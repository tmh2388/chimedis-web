# Dùng cho các pipeline tự động chạy thẳng trong repo này (không qua bước copy tay):
# - hoc_thuat (PubMed, EN→ZH): voices_google_en
# - y_an + bao_chi tự động (GPT-5-mini diễn giải, ZH gốc): voices_google_zh
voices_google_en:
  narrator: "en-US-Wavenet-D"

voices_google_zh:
  narrator: "cmn-CN-Wavenet-C"

# Giọng người học có thể chọn trong app (ngoài giọng mặc định narrator ở trên). Lưu ở <id>/<khóa>/NN-text_zh.mp3.
# 2026-10-12: rút còn 2 giọng — "default" (Wavenet, nam) + Aoede (Chirp 3 HD, nữ). Bỏ Zephyr/Orus: giảm một nửa dung lượng audio
# và ~2/3 chi phí TTS giọng bổ sung mỗi bài mà vẫn đủ lựa chọn nam/nữ.
voices_extra_zh:
  aoede: "cmn-CN-Chirp3-HD-Aoede"

# Giọng người học chọn cho bài tiếng Anh gốc (mục Học Thuật EN→ZH). Lưu ở <id>/<khóa>/NN-text_en.mp3. Cùng khóa với bản tiếng Trung
# để app dùng chung một lựa chọn giọng (Chirp 3 HD đa ngôn ngữ).
voices_extra_en:
  aoede: "en-US-Chirp3-HD-Aoede"

provider_settings:
  google:
    speaking_rate: 1.0
    pitch: 0.0

pause_ms: 420
